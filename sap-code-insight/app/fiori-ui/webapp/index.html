<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAP Code Insight</title>

    <script id="sap-ui-bootstrap"
            src="https://sapui5.hana.ondemand.com/resources/sap-ui-core.js"
            data-sap-ui-theme="sap_horizon"
            data-sap-ui-resourceroots='{"com.sap.codeinsight": "./"}'
            data-sap-ui-compatVersion="edge"
            data-sap-ui-async="true"
            data-sap-ui-frameOptions="allow"
            data-sap-ui-oninit="module:sap/ui/core/ComponentSupport">
    </script>

    <style>
        /* ═══ Premium Header ═══ */
        .codeInsightHeader {
            background: linear-gradient(135deg, #1a3a5c 0%, #0a6ed1 50%, #0854a0 100%);
            padding: 1rem 2rem 0.5rem 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .codeInsightHeaderInner {
            padding-bottom: 0.5rem;
        }
        .diligentLogoWrap {
            display: flex;
            align-items: center;
        }
        .diligentLogo {
            height: 50px;
            width: auto;
            margin-right: 0.5rem;
            object-fit: contain;
        }
        .codeInsightLogo {
            color: #ffffff !important;
            font-size: 2rem !important;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 0.6rem;
        }
        .codeInsightTitle .sapMTitle {
            color: #ffffff !important;
            font-weight: 700 !important;
            font-size: 1.25rem !important;
        }
        .codeInsightSubtitle {
            color: rgba(255,255,255,0.8) !important;
            font-size: 0.8rem !important;
        }
        .codeInsightHeaderBtn .sapMBtnInner {
            color: #ffffff !important;
            border-color: rgba(255,255,255,0.4) !important;
        }
        .codeInsightHeaderBtn .sapMBtnIcon {
            color: #ffffff !important;
        }

        /* ═══ Search Bar ═══ */
        .codeInsightSearchArea {
            padding: 0.75rem 0 1rem 0;
        }
        .codeInsightSearch .sapMSFI {
            border-radius: 24px !important;
            background: rgba(255,255,255,0.95) !important;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            height: 2.75rem;
        }
        .codeInsightSearch .sapMSFI:focus-within {
            box-shadow: 0 2px 12px rgba(255,255,255,0.3);
        }

        /* ═══ Code Editor ═══ */
        .codeEditorPanel .sapMPanel {
            border: 1px solid #d9d9d9;
        }

        /* ═══ Tenant Manager Dialog Table ═══ */
        .tenantTable .sapMListTblCell {
            vertical-align: middle;
        }
    </style>
</head>
<body class="sapUiBody" id="content">
    <div data-sap-ui-component
         data-name="com.sap.codeinsight"
         data-id="container"
         data-settings='{"id": "com.sap.codeinsight"}'
         data-handle-validation="true">
    </div>
</body>
</html>
