_schema-version: '3.1'
ID: sap-code-insight
version: 1.0.0
description: SAP Code Insight - AI-Powered ABAP Code Analysis & BRD Generator

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # ═══════════════════════════════════════════════════════════
  # CAP Backend Service
  # ═══════════════════════════════════════════════════════════
  - name: codeinsight-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    properties:
      CLAUDE_MODEL: "claude-sonnet-4-20250514"
      CLAUDE_MAX_TOKENS: "8192"
      CLAUDE_API_URL: "https://api.anthropic.com/v1/messages"
      SAP_DESTINATION: "S2A"
    build-parameters:
      builder: npm
    requires:
      - name: codeinsight-auth
      - name: codeinsight-db
      - name: codeinsight-destination
      - name: codeinsight-connectivity
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ═══════════════════════════════════════════════════════════
  # Fiori UI (App Router)
  # ═══════════════════════════════════════════════════════════
  - name: codeinsight-app
    type: approuter.nodejs
    path: app/
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: codeinsight-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  # ═══════════════════════════════════════════════════════════
  # HANA DB Deployer
  # ═══════════════════════════════════════════════════════════
  - name: codeinsight-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: custom
      commands: []
    requires:
      - name: codeinsight-db

resources:
  # ═══════════════════════════════════════════════════════════
  # XSUAA Service (Authentication)
  # ═══════════════════════════════════════════════════════════
  - name: codeinsight-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  # ═══════════════════════════════════════════════════════════
  # HANA Cloud (Database)
  # ═══════════════════════════════════════════════════════════
  - name: codeinsight-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # ═══════════════════════════════════════════════════════════
  # Destination Service (SAP On-Prem connectivity)
  # ═══════════════════════════════════════════════════════════
  - name: codeinsight-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  # ═══════════════════════════════════════════════════════════
  # Connectivity Service (Cloud Connector)
  # ═══════════════════════════════════════════════════════════
  - name: codeinsight-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
