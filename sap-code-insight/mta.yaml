_schema-version: '3.1'
ID: sap-code-insight
version: 1.0.0
description: SAP Code Insight - AI-Powered ABAP Code Analysis & BRD Generator

parameters:
  enable-parallel-deployments: true

modules:
  # ═══════════════════════════════════════════════════════════
  # CAP Backend Service
  # ═══════════════════════════════════════════════════════════
  - name: codeinsight-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    properties:
      ANTHROPIC_API_KEY: "~{claude-api/api-key}"
      CLAUDE_MODEL: "claude-sonnet-4-20250514"
      CLAUDE_MAX_TOKENS: "8192"
      SAP_DESTINATION: "SAP_ONPREM_RFC"
    requires:
      - name: codeinsight-auth
      - name: codeinsight-db
      - name: codeinsight-destination
      - name: claude-api
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ═══════════════════════════════════════════════════════════
  # Fiori UI (App Router)
  # ═══════════════════════════════════════════════════════════
  - name: codeinsight-app
    type: approuter.nodejs
    path: app/
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: codeinsight-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  # ═══════════════════════════════════════════════════════════
  # HANA DB Deployer (optional - for caching)
  # ═══════════════════════════════════════════════════════════
  - name: codeinsight-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: codeinsight-db

resources:
  # ═══════════════════════════════════════════════════════════
  # XSUAA Service (Authentication)
  # ═══════════════════════════════════════════════════════════
  - name: codeinsight-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  # ═══════════════════════════════════════════════════════════
  # HANA Cloud (Database)
  # ═══════════════════════════════════════════════════════════
  - name: codeinsight-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # ═══════════════════════════════════════════════════════════
  # Destination Service (SAP On-Prem connectivity)
  # ═══════════════════════════════════════════════════════════
  - name: codeinsight-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  # ═══════════════════════════════════════════════════════════
  # Claude API Credentials (User-Provided Service)
  # ═══════════════════════════════════════════════════════════
  - name: claude-api
    type: org.cloudfoundry.user-provided-service
    parameters:
      config:
        api-key: "<YOUR_ANTHROPIC_API_KEY>"

